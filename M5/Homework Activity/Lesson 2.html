<!DOCTYPE html>
<html>
<head>
    <title>Class Inheritance and Static Methods</title>
</head>
<body>
    <h1>Class Inheritance Example</h1>
    <p id="output"></p>

    <script>
        class Animal {
            constructor(name, color) {
                this.name = name;
                this.color = color;
            }

            describe() {
                return `I am ${this.name} and I am ${this.color}`;
            }

            static info() {
                return "This is the Animal class!";
            }
        }

        class Dog extends Animal {
            constructor(name, color, breed) {
                super(name, color);
                this.breed = breed;
            }

            describe() {
                return `I am ${this.name}, I am ${this.color}, and I am a ${this.breed}`;
            }
        }

        const myDog = new Dog("Buddy", "brown", "Golden Retriever");
        
        let result = "";
        result += "Static method: " + Animal.info() + "<br>";
        result += "Dog properties: " + myDog.describe() + "<br>";
        result += "Name: " + myDog.name + "<br>";
        result += "Color: " + myDog.color + "<br>";
        result += "Breed: " + myDog.breed;

        document.getElementById("output").innerHTML = result;
    </script>
</body>
</html>
